[package]
name = "prover_v2"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive", "rc"] }
tracing = "0.1.37"
bincode = "1.3.3"
anyhow = "1.0.97"
once_cell = "1.13.0"
zstd = "0.13.3"
lru = "0.14.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"

zkm-core-machine.workspace = true
zkm-core-executor.workspace = true
zkm-stark.workspace = true
zkm-prover.workspace = true
zkm-recursion-compiler.workspace = true
zkm-recursion-core.workspace = true
zkm-recursion-circuit.workspace = true
zkm-sdk.workspace = true

p3-maybe-rayon.workspace = true

zkm-gpu-prover = { git = "https://github.com/ProjectZKM/ziren-gpu", branch = "feat/multi-provers", optional = true }
zkm-gpu-core = { git = "https://github.com/ProjectZKM/ziren-gpu", branch = "feat/multi-provers", optional = true }

common = { path = "../common" }
tempfile = "3.18.0"
lazy_static = "1.5.0"

[features]
debug = []
gpu = ["dep:zkm-gpu-prover", "dep:zkm-gpu-core"]
