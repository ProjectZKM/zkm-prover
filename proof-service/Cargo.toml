[package]
name = "proof-service"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
prover_v2 = { path = "../prover_v2" }
common = { workspace = true }

bincode.workspace = true

tonic = { workspace = true, features = ["gzip"] }
prost.workspace = true
tokio = { version = "1.21.0", features = ["macros", "rt-multi-thread", "signal"] }

once_cell.workspace = true
uuid.workspace = true
sqlx.workspace = true
serde = "1.0.92"
serde_json = "1.0"
serde_derive = "1.0.92"
log = "0.4.0"
env_logger = "0.10"
toml = "0.5.1"
lazy_static = "1.4"
clap = "4.5.2"
anyhow = "1.0.75"
hex = "0.4.3"
ethers = "2.0.14"
prometheus = "0.13"
hyper = { version = "^0.14", features = ["server", "http1", "tcp"] }
rand = "0.8"
sha2 = "0.10.9"

# file server
tracing = "0.1.37"
tracing-forest = { version = "0.1.6", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.19", features = ["std", "env-filter"] }
rayon = "1.10.0"

[[bin]]
name = "proof-service"
path = "src/bin/proof-service.rs"

[build-dependencies]
tonic-build = "0.8.0"

[features]
default = []
gpu = ["prover_v2/gpu"]
